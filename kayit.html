<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Üye Ol - Doğuş Alışveriş Merkezi</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="css/style.css?v=202412251225">
    <link rel="stylesheet" href="css/auth.css?v=202412251225">
</head>
<body>
    <!-- HEADER -->
    <header class="header">
        <div class="container">
            <div class="header-content">
                <a href="index.html" class="logo">
                    <h1>DOĞUŞ</h1>
                    <span>ALIŞVERİŞ MERKEZİ</span>
                </a>
                
                <nav class="nav">
                    <a href="index.html" class="nav-link">Ana Sayfa</a>
                    <a href="index.html#urunlerimiz" class="nav-link">Ürünlerimiz</a>
                    <a href="index.html#markalar" class="nav-link">Markalar</a>
                    <a href="index.html#iletisim" class="nav-link">İletişim</a>
                </nav>
                
                <div class="user-actions">
                    <a href="giris.html" class="btn btn-secondary">Giriş Yap</a>
                </div>
            </div>
        </div>
    </header>

    <!-- AUTH CONTAINER -->
    <div class="auth-container">
        <div class="auth-box">
            <div class="auth-header">
                <h1>Üye Ol</h1>
                <p>Hemen üye olun, avantajlardan yararlanın</p>
            </div>

            <form id="registerForm" class="auth-form">
                <div class="form-group">
                    <label for="name">Ad Soyad *</label>
                    <input type="text" id="name" name="name" required placeholder="Adınız Soyadınız">
                </div>

                <div class="form-group">
                    <label for="email">E-posta Adresi *</label>
                    <input type="email" id="email" name="email" required placeholder="ornek@email.com">
                </div>

                <div class="form-group">
                    <label for="phone">Telefon Numarası *</label>
                    <input type="tel" id="phone" name="phone" required placeholder="05XX XXX XX XX" pattern="[0-9]{10,11}">
                    <small>Örnek: 05321234567</small>
                </div>

                <div class="form-group">
                    <label for="address">Adres</label>
                    <textarea id="address" name="address" rows="3" placeholder="Teslimat adresiniz (isteğe bağlı)"></textarea>
                </div>

                <div class="form-group">
                    <label for="password">Şifre *</label>
                    <div class="password-input">
                        <input type="password" id="password" name="password" required placeholder="••••••••" minlength="6">
                        <button type="button" class="toggle-password" onclick="togglePassword('password')">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                    <small>En az 6 karakter olmalıdır</small>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Şifre Tekrar *</label>
                    <div class="password-input">
                        <input type="password" id="confirmPassword" name="confirmPassword" required placeholder="••••••••" minlength="6">
                        <button type="button" class="toggle-password" onclick="togglePassword('confirmPassword')">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="form-group">
                    <label class="checkbox-label">
                        <input type="checkbox" name="terms" required>
                        <span><a href="#" target="_blank">Kullanım şartlarını</a> ve <a href="#" target="_blank">gizlilik politikasını</a> kabul ediyorum</span>
                    </label>
                </div>

                <div class="form-group">
                    <label class="checkbox-label">
                        <input type="checkbox" name="newsletter">
                        <span>Kampanya ve fırsatlardan haberdar olmak istiyorum</span>
                    </label>
                </div>

                <button type="submit" class="btn btn-primary btn-full">
                    Üye Ol
                </button>
            </form>

            <div class="auth-footer">
                <p>Zaten üye misiniz? <a href="giris.html">Giriş Yap</a></p>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
    
    <!-- Firebase Config -->
    <script src="js/firebase-config.js?v=20241225"></script>
    
    <!-- SCRIPTS -->
    <script src="js/auth.js?v=20241225"></script>
    <script>
        // Email validation fonksiyonu
        async function validateEmail(email) {
            // 1. Format kontrolü
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                return { valid: false, message: 'Geçersiz e-posta formatı!' };
            }

            // 2. Domain kontrolü - yaygın email sağlayıcıları
            const validDomains = [
                'gmail.com', 'hotmail.com', 'outlook.com', 'yahoo.com', 
                'icloud.com', 'yandex.com', 'yandex.com.tr',
                'hotmail.com.tr', 'outlook.com.tr', 'yahoo.com.tr',
                'mynet.com', 'turk.net', 'ttmail.com', 'windowslive.com'
            ];

            const domain = email.split('@')[1];
            
            // Eğer yaygın domainlerden değilse uyar ama yine de kabul et
            if (!validDomains.includes(domain)) {
                console.warn(`⚠️ Bilinmeyen email domain: ${domain}`);
                // Yine de devam et, kurumsal email olabilir
            }

            // 3. Disposable/geçici email kontrolü (10minutemail, tempmail vb.)
            const disposableDomains = [
                '10minutemail.com', 'tempmail.com', 'guerrillamail.com',
                'mailinator.com', 'throwaway.email', 'temp-mail.org'
            ];

            if (disposableDomains.includes(domain)) {
                return { valid: false, message: 'Geçici e-posta adresleri kabul edilmez!' };
            }

            return { valid: true, message: 'E-posta adresi geçerli' };
        }

        // Check if already logged in
        if (authSystem.isLoggedIn()) {
            window.location.href = 'profil.html';
        }

        // Register form handler
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            // Email validation
            const emailValidation = await validateEmail(email);
            if (!emailValidation.valid) {
                showNotification(emailValidation.message, 'error');
                return;
            }

            if (password !== confirmPassword) {
                showNotification('Şifreler eşleşmiyor!', 'error');
                return;
            }

            const btn = this.querySelector('button[type="submit"]');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Kaydediliyor...';

            const userData = {
                name:     document.getElementById('name').value,
                email:    email,
                phone:    document.getElementById('phone').value,
                address:  document.getElementById('address').value,
                password: password // DÜZ ŞİFRE - HASH YOK
            };

            console.log('🚀 Kayıt başlatılıyor...');

            try {
                // LocalStorage kullanılabilir mi test et
                const testKey = '__storage_test__';
                localStorage.setItem(testKey, 'test');
                localStorage.removeItem(testKey);
                console.log('✅ LocalStorage kullanılabilir');
            } catch (error) {
                console.error('❌ LocalStorage KULLANILAMIYOR:', error);
                showNotification('HATA: Tarayıcınız gizli modda veya çerezler devre dışı! Lütfen normal modda açın.', 'error');
                btn.disabled = false;
                btn.innerHTML = 'Üye Ol';
                return;
            }

            // LocalStorage'a kaydet (DÜZ ŞİFRE)
            const users = JSON.parse(localStorage.getItem('dogusUsers') || '[]');
            console.log('📦 Mevcut kullanıcılar:', users.length);
            
            // Email kontrolü
            if (users.find(u => u.email === email)) {
                showNotification('Bu e-posta zaten kayıtlı!', 'error');
                btn.disabled = false;
                btn.innerHTML = 'Üye Ol';
                return;
            }

            // Yeni kullanıcı ekle
            const newUser = {
                id: 'user_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9),
                name: userData.name,
                email: userData.email,
                phone: userData.phone,
                address: userData.address,
                password: userData.password,
                provider: 'email', // Admin paneli için gerekli
                createdAt: new Date().toISOString()
            };
            
            users.push(newUser);
            
            // KAYDET ve DOĞRULA
            try {
                // 1. LocalStorage'a kaydet
                localStorage.setItem('dogusUsers', JSON.stringify(users));
                console.log('💾 LocalStorage\'a yazıldı');
                
                // 2. Firebase'e de kaydet (async)
                try {
                    if (typeof db !== 'undefined' && db) {
                        await db.collection('customers').add({
                            name: newUser.name,
                            email: newUser.email,
                            phone: newUser.phone,
                            address: newUser.address,
                            provider: 'email',
                            createdAt: firebase.firestore.FieldValue.serverTimestamp()
                        });
                        console.log('🔥 Firebase\'e de kaydedildi');
                    } else {
                        console.warn('⚠️ Firebase bağlantısı yok, sadece LocalStorage kullanıldı');
                    }
                } catch (firebaseError) {
                    console.error('⚠️ Firebase kayıt hatası (LocalStorage çalışıyor):', firebaseError);
                }
                
                // 3. DOĞRULA
                const verification = JSON.parse(localStorage.getItem('dogusUsers') || '[]');
                console.log('✅ Doğrulama: ' + verification.length + ' kullanıcı okundu');
                
                if (verification.find(u => u.id === newUser.id)) {
                    console.log('✅✅ BAŞARILI: Kullanıcı kaydedildi VE doğrulandı!');
                    
                    // Kullanıcıyı otomatik giriş yap
                    localStorage.setItem('dogusCurrentUser', JSON.stringify(newUser));
                    
                    showNotification('Kayıt başarılı! Profil sayfasına yönlendiriliyorsunuz...', 'success');
                    setTimeout(() => { 
                        window.location.href = 'profil.html'; 
                    }, 1000);
                } else {
                    throw new Error('Doğrulama başarısız - kullanıcı bulunamadı');
                }
            } catch (saveError) {
                console.error('❌ KAYDETME HATASI:', saveError);
                showNotification('HATA: Kayıt yapılamadı! Tarayıcı ayarlarınızı kontrol edin.', 'error');
                btn.disabled = false;
                btn.innerHTML = 'Üye Ol';
            }
        });

        function togglePassword(inputId) {
            const input = document.getElementById(inputId);
            const icon = input.nextElementSibling.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }

        // Notification system
        function showNotification(message, type = 'info') {
            const notification = document.createElement('div');
            notification.className = `notification notification-${type}`;
            notification.innerHTML = `
                <i class="fas fa-${type === 'success' ? 'check-circle' : type === 'error' ? 'exclamation-circle' : 'info-circle'}"></i>
                <span>${message}</span>
            `;
            
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.classList.add('show');
            }, 100);
            
            setTimeout(() => {
                notification.classList.remove('show');
                setTimeout(() => {
                    notification.remove();
                }, 300);
            }, 3000);
        }

        // Phone number formatting
        document.getElementById('phone').addEventListener('input', function(e) {
            let value = e.target.value.replace(/\D/g, '');
            if (value.length > 11) {
                value = value.substr(0, 11);
            }
            e.target.value = value;
        });
    </script>
</body>
</html>
