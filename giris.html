<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Yap - Doğuş Alışveriş Merkezi</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="css/style.css?v=202412251225">
    <link rel="stylesheet" href="css/auth.css?v=202412251225">
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    
    <!-- Firebase Config -->
    <script src="js/firebase-config.js"></script>
</head>
<body>
    <!-- HEADER -->
    <header class="header">
        <div class="container">
            <div class="header-content">
                <a href="index.html" class="logo">
                    <h1>DOĞUŞ</h1>
                    <span>ALIŞVERİŞ MERKEZİ</span>
                </a>
                
                <nav class="nav">
                    <a href="index.html" class="nav-link">Ana Sayfa</a>
                    <a href="index.html#urunlerimiz" class="nav-link">Ürünlerimiz</a>
                    <a href="index.html#markalar" class="nav-link">Markalar</a>
                    <a href="index.html#iletisim" class="nav-link">İletişim</a>
                </nav>
                
                <div class="user-actions">
                    <a href="kayit.html" class="btn btn-secondary">Üye Ol</a>
                </div>
            </div>
        </div>
    </header>

    <!-- AUTH CONTAINER -->
    <div class="auth-container">
        <div class="auth-box">
            <div class="auth-header">
                <h1>Hoş Geldiniz</h1>
                <p>Hesabınıza giriş yapın</p>
            </div>

            <form id="loginForm" class="auth-form">
                <div class="form-group">
                    <label for="email">E-posta Adresi</label>
                    <input type="email" id="email" name="email" required placeholder="ornek@email.com">
                </div>

                <div class="form-group">
                    <label for="password">Şifre</label>
                    <div class="password-input">
                        <input type="password" id="password" name="password" required placeholder="••••••••">
                        <button type="button" class="toggle-password" onclick="togglePassword('password')">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="form-options">
                    <label class="checkbox-label">
                        <input type="checkbox" name="remember">
                        <span>Beni Hatırla</span>
                    </label>
                    <a href="#" class="forgot-password">Şifremi Unuttum</a>
                </div>

                <button type="submit" class="btn btn-primary btn-full">
                    Giriş Yap
                </button>
            </form>

            <div class="auth-footer">
                <p>Hesabınız yok mu? <a href="kayit.html">Üye Ol</a></p>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
    
    <!-- Firebase Config -->
    <script src="js/firebase-config.js?v=20241225"></script>
    
    <!-- SCRIPTS -->
    <script src="js/auth.js?v=20241225"></script>
    <script>
        // Email validation fonksiyonu
        async function validateEmail(email) {
            // 1. Format kontrolü
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                return { valid: false, message: 'Geçersiz e-posta formatı!' };
            }

            // 2. Domain kontrolü - yaygın email sağlayıcıları
            const validDomains = [
                'gmail.com', 'hotmail.com', 'outlook.com', 'yahoo.com', 
                'icloud.com', 'yandex.com', 'yandex.com.tr',
                'hotmail.com.tr', 'outlook.com.tr', 'yahoo.com.tr',
                'mynet.com', 'turk.net', 'ttmail.com', 'windowslive.com'
            ];

            const domain = email.split('@')[1];
            
            // Eğer yaygın domainlerden değilse uyar ama yine de kabul et
            if (!validDomains.includes(domain)) {
                console.warn(`⚠️ Bilinmeyen email domain: ${domain}`);
                // Yine de devam et, kurumsal email olabilir
            }

            return { valid: true, message: 'E-posta adresi geçerli' };
        }

        // Check if already logged in
        if (authSystem.isLoggedIn()) {
            window.location.href = 'profil.html';
        }

        // ===== AUTH FUNCTIONS =====
        
        // Simple password hash
        function hashPassword(password) {
            let hash = 0;
            for (let i = 0; i < password.length; i++) {
                const char = password.charCodeAt(i);
                hash = ((hash << 5) - hash) + char;
                hash = hash & hash;
            }
            return hash.toString();
        }
        
        // Login function (Firebase + LocalStorage)
        async function authLogin(email, password) {
            // Firebase'den kontrol et
            try {
                if (typeof db !== 'undefined' && db) {
                    console.log('🔥 Firebase girişi kontrol ediliyor...');
                    
                    const snapshot = await db.collection('customers')
                        .where('email', '==', email)
                        .limit(1)
                        .get();
                    
                    if (!snapshot.empty) {
                        const doc = snapshot.docs[0];
                        const user = { id: doc.id, ...doc.data() };
                        
                        // Şifre kontrolü
                        if (user.password === hashPassword(password)) {
                            // Başarılı giriş
                            const { password: _, ...userWithoutPassword } = user;
                            localStorage.setItem('dogusCurrentUser', JSON.stringify(userWithoutPassword));
                            
                            console.log('✅ Firebase giriş başarılı');
                            return { success: true, message: 'Giriş başarılı!' };
                        } else {
                            console.log('❌ Şifre hatalı');
                            return { success: false, message: 'Şifre hatalı!' };
                        }
                    }
                }
            } catch (error) {
                console.error('❌ Firebase login hatası:', error);
            }
            
            // Fallback: LocalStorage
            console.log('📝 LocalStorage kontrolü...');
            const users = JSON.parse(localStorage.getItem('dogusUsers') || '[]');
            const user = users.find(u => u.email === email);

            if (!user) {
                return { success: false, message: 'E-posta adresi bulunamadı!' };
            }

            if (user.password !== hashPassword(password)) {
                return { success: false, message: 'Şifre hatalı!' };
            }

            // Başarılı giriş
            const { password: _, ...userWithoutPassword } = user;
            localStorage.setItem('dogusCurrentUser', JSON.stringify(userWithoutPassword));
            
            console.log('✅ LocalStorage giriş başarılı');
            return { success: true, message: 'Giriş başarılı!' };
        }
        
        // Email validation
        async function validateEmail(email) {
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                return { valid: false, message: 'Geçerli bir e-posta adresi girin!' };
            }
            return { valid: true };
        }
        
        // Login form handler
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            // Email validation
            const emailValidation = await validateEmail(email);
            if (!emailValidation.valid) {
                showNotification(emailValidation.message, 'error');
                return;
            }

            const btn = this.querySelector('button[type="submit"]');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Giriş yapılıyor...';

            const result = await authLogin(email, password);

            if (result.success) {
                showNotification(result.message, 'success');
                setTimeout(() => { window.location.href = 'index.html'; }, 1000);
            } else {
                showNotification(result.message, 'error');
                btn.disabled = false;
                btn.innerHTML = 'Giriş Yap';
            }
        });

        function togglePassword(inputId) {
            const input = document.getElementById(inputId);
            const icon = input.nextElementSibling.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }

        // Notification system
        function showNotification(message, type = 'info') {
            const notification = document.createElement('div');
            notification.className = `notification notification-${type}`;
            notification.innerHTML = `
                <i class="fas fa-${type === 'success' ? 'check-circle' : type === 'error' ? 'exclamation-circle' : 'info-circle'}"></i>
                <span>${message}</span>
            `;
            
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.classList.add('show');
            }, 100);
            
            setTimeout(() => {
                notification.classList.remove('show');
                setTimeout(() => {
                    notification.remove();
                }, 300);
            }, 3000);
        }
    </script>
</body>
</html>
