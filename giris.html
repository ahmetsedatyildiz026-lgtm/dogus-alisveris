<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Yap - Doğuş Alışveriş Merkezi</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="css/style.css?v=202412251225">
    <link rel="stylesheet" href="css/auth.css?v=202412251225">
</head>
<body>
    <!-- HEADER -->
    <header class="header">
        <div class="container">
            <div class="header-content">
                <a href="index.html" class="logo">
                    <h1>DOĞUŞ</h1>
                    <span>ALIŞVERİŞ MERKEZİ</span>
                </a>
                
                <nav class="nav">
                    <a href="index.html" class="nav-link">Ana Sayfa</a>
                    <a href="index.html#urunlerimiz" class="nav-link">Ürünlerimiz</a>
                    <a href="index.html#markalar" class="nav-link">Markalar</a>
                    <a href="index.html#iletisim" class="nav-link">İletişim</a>
                </nav>
                
                <div class="user-actions">
                    <a href="kayit.html" class="btn btn-secondary">Üye Ol</a>
                </div>
            </div>
        </div>
    </header>

    <!-- AUTH CONTAINER -->
    <div class="auth-container">
        <div class="auth-box">
            <div class="auth-header">
                <h1>Hoş Geldiniz</h1>
                <p>Hesabınıza giriş yapın</p>
            </div>

            <form id="loginForm" class="auth-form">
                <div class="form-group">
                    <label for="email">E-posta Adresi</label>
                    <input type="email" id="email" name="email" required placeholder="ornek@email.com">
                </div>

                <div class="form-group">
                    <label for="password">Şifre</label>
                    <div class="password-input">
                        <input type="password" id="password" name="password" required placeholder="••••••••">
                        <button type="button" class="toggle-password" onclick="togglePassword('password')">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="form-options">
                    <label class="checkbox-label">
                        <input type="checkbox" name="remember">
                        <span>Beni Hatırla</span>
                    </label>
                    <a href="#" class="forgot-password">Şifremi Unuttum</a>
                </div>

                <button type="submit" class="btn btn-primary btn-full">
                    Giriş Yap
                </button>
            </form>

            <div class="auth-divider">
                <span>veya</span>
            </div>

            <button class="btn btn-google" onclick="googleSignIn()">
                <i class="fab fa-google"></i>
                Google ile Giriş Yap
            </button>

            <div class="auth-footer">
                <p>Hesabınız yok mu? <a href="kayit.html">Üye Ol</a></p>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
    
    <!-- Firebase Config -->
    <script src="js/firebase-config.js?v=20241225"></script>
    
    <!-- SCRIPTS -->
    <script src="js/auth.js?v=20241225"></script>
    <script>
        // Check if already logged in
        if (authSystem.isLoggedIn()) {
            window.location.href = 'profil.html';
        }

        // Login form handler
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = this.querySelector('button[type="submit"]');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Giriş yapılıyor...';

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            const result = await authLogin(email, password);

            if (result.success) {
                showNotification(result.message, 'success');
                setTimeout(() => { window.location.href = 'index.html'; }, 1000);
            } else {
                showNotification(result.message, 'error');
                btn.disabled = false;
                btn.innerHTML = 'Giriş Yap';
            }
        });

        function togglePassword(inputId) {
            const input = document.getElementById(inputId);
            const icon = input.nextElementSibling.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }

        async function googleSignIn() {
            const btn = document.querySelector('.btn-google');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Bağlanıyor...';

            try {
                // Direkt firebase kontrolü
                if (typeof firebase === 'undefined') {
                    throw new Error('Firebase SDK yüklenmedi');
                }
                
                // firebase.auth() direkt kullan - global değişkenleri beklemeden
                const auth = firebase.auth();
                if (!auth) {
                    throw new Error('Firebase Auth başlatılamadı');
                }
                
                console.log('✅ Firebase Auth hazır!');
                console.log('🔐 Google giriş butonu tıklandı');
                
                const provider = new firebase.auth.GoogleAuthProvider();
                const result = await auth.signInWithPopup(provider);
                
                const user = result.user;
                console.log('✅ Google ile giriş başarılı:', user.email);
                
                // Kullanıcıyı Firestore'a kaydet
                const db = firebase.firestore();
                const userDoc = await db.collection('customers').doc(user.uid).get();
                
                let userData;
                if (!userDoc.exists) {
                    userData = {
                        id: user.uid,
                        name: user.displayName,
                        email: user.email,
                        phone: user.phoneNumber || '',
                        address: '',
                        provider: 'google',
                        photoURL: user.photoURL,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    };
                    
                    await db.collection('customers').doc(user.uid).set(userData);
                    console.log('✅ Yeni kullanıcı Firestore\'a kaydedildi');
                } else {
                    userData = { id: user.uid, ...userDoc.data() };
                }
                
                // LocalStorage'a kaydet
                localStorage.setItem('dogusCurrentUser', JSON.stringify(userData));
                
                showNotification('Google ile giriş başarılı!', 'success');
                setTimeout(() => { window.location.href = 'index.html'; }, 1000);
                
            } catch (error) {
                console.error('❌ Google giriş hatası:', error);
                
                let errorMsg = 'Giriş yapılamadı. ';
                if (error.code === 'auth/popup-closed-by-user') {
                    errorMsg = 'Google girişi iptal edildi.';
                } else if (error.code === 'auth/unauthorized-domain') {
                    errorMsg = 'Bu domain yetkili değil. Firebase Console\'da authorized domains ekleyin.';
                } else if (error.message.includes('SDK')) {
                    errorMsg = 'Firebase yüklenemedi. Sayfayı yenileyin veya internet bağlantınızı kontrol edin.';
                } else {
                    errorMsg += error.message;
                }
                
                showNotification(errorMsg, 'error');
                btn.disabled = false;
                btn.innerHTML = '<i class="fab fa-google"></i> Google ile Giriş Yap';
            }
        }

        // Notification system
        function showNotification(message, type = 'info') {
            const notification = document.createElement('div');
            notification.className = `notification notification-${type}`;
            notification.innerHTML = `
                <i class="fas fa-${type === 'success' ? 'check-circle' : type === 'error' ? 'exclamation-circle' : 'info-circle'}"></i>
                <span>${message}</span>
            `;
            
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.classList.add('show');
            }, 100);
            
            setTimeout(() => {
                notification.classList.remove('show');
                setTimeout(() => {
                    notification.remove();
                }, 300);
            }, 3000);
        }
    </script>
</body>
</html>
